name: Build and Push Docker Image (Reusable)

on:
  workflow_call:
    inputs:
      caddy_version:
        description: 'Caddy version to build (without v prefix, e.g., 2.8.0)'
        required: true
        type: string
      dockerfile:
        description: 'Dockerfile to use'
        required: true
        type: string
      alias_suffix:
        description: 'Also push the version tags with this suffix (e.g., "-alpine"). Leave empty for none.'
        required: false
        type: string
        default: ''
      image_title:
        description: 'Image title for OCI labels'
        required: true
        type: string
      image_description:
        description: 'Image description for OCI labels'
        required: true
        type: string
      static_tag:
        description: 'Additional static tag (e.g., "alpine"). Leave empty for none.'
        required: false
        type: string
        default: ''
      flavor_latest:
        description: 'Whether to tag as latest (auto/true/false)'
        required: false
        type: string
        default: 'auto'
      create_release:
        description: 'Whether to create a GitHub Release'
        required: false
        type: boolean
        default: false
      build_reason:
        description: 'Why this build was triggered (new_caddy_version/module_update/base_image_update)'
        required: false
        type: string
        default: ''
      build_details:
        description: 'What changed, e.g. module commits or republished base tags. Shown in release notes and image labels.'
        required: false
        type: string
        default: ''
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      DOCKERHUB_REPOSITORY_NAME:
        required: false

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          user: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
        if: ${{ env.user != '' && env.token != '' }}

      - name: Set Repository Owner and Name in Lowercase
        run: |
          REPO_OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_OWNER=${REPO_OWNER}" >> $GITHUB_ENV
          REPO_NAME=$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_NAME=${REPO_NAME}" >> $GITHUB_ENV
          # Strip v prefix if present
          VERSION="${{ inputs.caddy_version }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::No version specified."
            exit 1
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Set Docker Hub image (if credentials exist)
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            if [ -n "${{ secrets.DOCKERHUB_REPOSITORY_NAME }}" ]; then
              echo "DOCKERHUB_IMAGE=${{ secrets.DOCKERHUB_REPOSITORY_NAME }}" >> $GITHUB_ENV
            else
              echo "DOCKERHUB_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME }}" >> $GITHUB_ENV
            fi
          else
            echo "Warning: DOCKERHUB_USERNAME or DOCKERHUB_TOKEN not set. Docker Hub image will not be pushed."
          fi

      # Defaults cover url, source, licenses, created, revision and version (suffix included).
      # Labels feed `docker inspect`; GHCR reads a multi-arch image's description from the
      # index annotations, so the overrides go in both.
      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            ghcr.io/${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}
            ${{ env.DOCKERHUB_IMAGE }}
          flavor: |
            latest=${{ inputs.flavor_latest }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}
            type=semver,pattern={{version}},value=${{ env.VERSION }},suffix=${{ inputs.alias_suffix }},enable=${{ inputs.alias_suffix != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }},suffix=${{ inputs.alias_suffix }},enable=${{ inputs.alias_suffix != '' }}
            type=semver,pattern={{major}},value=${{ env.VERSION }},suffix=${{ inputs.alias_suffix }},enable=${{ inputs.alias_suffix != '' }}
            type=raw,value=${{ inputs.static_tag }},suffix=,enable=${{ inputs.static_tag != '' }}
          labels: |
            org.opencontainers.image.title=${{ inputs.image_title }}
            org.opencontainers.image.description=${{ inputs.image_description }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            caddy-build.reason=${{ inputs.build_reason || 'manual' }}
            caddy-build.details=${{ inputs.build_details }}
          annotations: |
            org.opencontainers.image.title=${{ inputs.image_title }}
            org.opencontainers.image.description=${{ inputs.image_description }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            caddy-build.reason=${{ inputs.build_reason || 'manual' }}
            caddy-build.details=${{ inputs.build_details }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          build-args: |
            CADDY_VERSION=${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le,linux/s390x
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Verify built image
        run: |
          IMAGE="ghcr.io/${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}:${{ env.VERSION }}"
          echo "Pulling ${IMAGE}..."
          docker pull "${IMAGE}"
          echo "Checking caddy version..."
          docker run --rm "${IMAGE}" caddy version
          echo "Checking cloudflare module is loaded..."
          docker run --rm "${IMAGE}" caddy list-modules | grep -q "dns.providers.cloudflare"
          echo "Build verification passed."

      # New version: create its release. Rebuild of an existing version: append a dated
      # line under "Rebuilds" so a changed digest can be traced back to its cause.
      - name: Create or update GitHub Release
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ inputs.build_reason || 'manual' }}
          DETAILS: ${{ inputs.build_details }}
        run: |
          if ! body=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null); then
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
              --title "Caddy v$VERSION" \
              --notes "Caddy v$VERSION with Cloudflare DNS modules. See the full release notes [here](https://github.com/caddyserver/caddy/releases/tag/v$VERSION)."
            exit 0
          fi
          case "$body" in *"## Rebuilds"*) ;; *) body="$(printf '%s\n\n## Rebuilds\n' "$body")" ;; esac
          line="- $(date -u +%Y-%m-%d): ${REASON//_/ }${DETAILS:+ — $DETAILS}"
          printf '%s\n%s\n' "$body" "$line" | gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file -

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Build failed: Caddy v${{ env.VERSION }}`,
              body: `The automated build failed.\n\n- **Version:** ${{ env.VERSION }}\n- **Reason:** ${{ inputs.build_reason || 'manual' }}\n- **Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['build-failure']
            });
