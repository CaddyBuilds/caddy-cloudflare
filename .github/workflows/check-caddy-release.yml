name: Check Caddy Releases and Trigger Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    uses: CaddyBuilds/caddy-base/.github/workflows/check-release.yml@v1
    secrets: inherit
